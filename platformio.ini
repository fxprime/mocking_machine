[platformio]
default_envs = esp-wrover-kit

[env]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
build_unflags = -std=gnu++11

[env:esp-wrover-kit]
platform = espressif32@6.10.0
board = esp-wrover-kit
framework = arduino
monitor_filters = esp32_exception_decoder
extra_scripts = pre:scripts/generate_build_info.py
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<control/IncrementalVelocityController.cpp>
    +<control/MotionLimiter.cpp>
    +<control/PositionController.cpp>
    +<control/VelocityEstimator.cpp>
    +<profile/VelocityProfile.cpp>
    +<protocol/Crc16.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
