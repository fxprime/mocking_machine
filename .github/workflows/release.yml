name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            command: npm run dist:mac -- --publish=never
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - platform: Linux
            runner: ubuntu-latest
            command: npm run dist:linux -- --publish=never
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          - platform: Windows
            runner: windows-latest
            command: npm run dist:win -- --publish=never
            artifacts: |
              dist/*-setup.exe
              dist/*-portable.exe
              dist/*.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:desktop
      - run: npm run test:web
      - run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: mocking-machine-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --generate-notes --title "Mocking Machine $GITHUB_REF_NAME"
